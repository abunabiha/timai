name: TimAI CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Linter (Ruff)
        run: |
          ruff check backend/

      - name: Run Test Suite (Pytest)
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SYNC_DATABASE_URL: sqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-github-actions-ci-pipeline
          MASTER_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: |
          cd backend
          pytest -v

  frontend-lint-and-build:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Run Frontend Integrity Tests
        working-directory: frontend
        run: |
          npm test

      - name: Build Next.js Production Bundle
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build

  docker-build-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config

      - name: Build Docker Images
        run: |
          docker compose build backend worker frontend
